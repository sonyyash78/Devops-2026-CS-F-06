apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  labels:
    app: backend
data:
  NODE_ENV: "production"
  PORT: "5000"
  MONGO_URI: "mongodb://mongodb-service:27017/pharmadesk"
  CLIENT_URL: "http://localhost:30080"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  labels:
    app: backend
type: Opaque
stringData:
  JWT_ACCESS_SECRET: "k8s_super_secret_jwt_access_token_pharmadesk_2026"
  JWT_REFRESH_SECRET: "k8s_super_secret_jwt_refresh_token_pharmadesk_2026"
