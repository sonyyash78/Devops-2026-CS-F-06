name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm' # Speeds up installations

    - name: Install Dependencies
      run: |
        npm ci
        npm ci --prefix server
        npm ci --prefix client --legacy-peer-deps

    - name: Test Server
      run: |
        NO_COLOR=1 npm --prefix server test > test-results.log

    - name: Lint Client
      run: |
        npm --prefix client run lint

    - name: Build Client
      run: |
        npm --prefix client run build

    - name: Upload Test Results Artifact
      uses: actions/upload-artifact@v4
      if: always() # Uploads the test logs even if the tests fail
      with:
        name: test-results
        path: test-results.log
