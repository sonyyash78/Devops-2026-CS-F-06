services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mongo-data:/data/db

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    env_file:
      - server/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/pharmadesk
      NODE_ENV: production
      PORT: 5000
    volumes:
      - ./server/uploads:/app/server/uploads

volumes:
  mongo-data:
